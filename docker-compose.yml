services:
  agent-api:
    build: .
    container_name: agent-api
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: llama3
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: