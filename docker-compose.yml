services:
  agent-api:
    build: .
    container_name: agent-api
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: llama3
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

volumes:
  ollama_data: